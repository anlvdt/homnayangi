name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prune dev-only files from the published site
        run: |
          rm -rf tests docs .devin .kiro .agent .vscode design-system \
            KARPATHY-AI-LEARNING-GUIDE.md CLAUDE-CODE-FREE-GUIDE.md \
            design-system-output.md jest.config.js package.json \
            package-lock.json app.test.js dish-data.test.js \
            tools-grade-images.py tools-make-icons.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
